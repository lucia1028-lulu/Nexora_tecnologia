<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Iniciar sesión | Nexora</title>
  <meta name="description" content="Accede a tu cuenta de Nexora para consultar tus productos y pedidos.">
  <meta name="theme-color" content="#f4f6fb">
  <script>document.documentElement.classList.add('js');</script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
  <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css">
  <link rel="stylesheet" href="styles.css">
  <script src="js/auth.js" defer></script>
</head>
<body data-page="auth">
  <a class="skip-link" href="#main">Saltar al contenido</a>
  <div class="bg-orbs" aria-hidden="true"><span></span><span></span><span></span></div>

  <header class="site-header" id="siteHeader">
    <div class="container header-inner">
      <a href="index.html" class="logo" aria-label="Nexora, ir al inicio">
        <span class="logo__mark"><i class="ph-fill ph-cpu" aria-hidden="true"></i></span>
        <span class="logo__text">Nexora</span>
      </a>
      <nav class="nav" id="mainNav" aria-label="Principal">
        <ul class="nav__list">
          <li><a href="index.html" class="nav__link">Inicio</a></li>
          <li><a href="promociones.html" class="nav__link">Promociones</a></li>
          <li><a href="consultas.html" class="nav__link">Consultas</a></li>
        </ul>
        <a href="productos.html" class="btn btn--primary btn--sm nav__cta">Ver productos <i class="ph ph-arrow-right" aria-hidden="true"></i></a>
      </nav>
      <div class="header-actions">
        <button type="button" class="icon-btn menu-toggle" id="menuToggle" aria-expanded="false" aria-controls="mainNav" aria-label="Abrir menú">
          <i class="ph ph-list" aria-hidden="true"></i>
        </button>
      </div>
    </div>
  </header>

  <main id="main" class="auth-page">
    <div class="container">
      <section class="auth-card" aria-labelledby="loginTitle">
        <header class="auth-header">
          <span class="logo__mark" aria-hidden="true"><i class="ph-fill ph-cpu"></i></span>
          <span class="eyebrow">BIENVENIDO DE NUEVO</span>
          <h1 id="loginTitle">Iniciar sesión</h1>
          <p>Accede para consultar tus productos y pedidos.</p>
        </header>

        <p class="auth-message" id="authMessage" role="status" aria-live="polite" hidden></p>

        <form id="loginForm" class="form" novalidate>
          <div class="field">
            <label for="loginEmail">Correo electrónico</label>
            <div class="input-wrap">
              <i class="ph ph-envelope" aria-hidden="true"></i>
              <input type="email" id="loginEmail" autocomplete="email" required maxlength="120" placeholder="nombre@correo.com">
            </div>
          </div>

          <div class="field">
            <label for="loginPassword">Contraseña</label>
            <div class="input-wrap">
              <i class="ph ph-lock-key" aria-hidden="true"></i>
              <input type="password" id="loginPassword" autocomplete="current-password" required minlength="6" maxlength="64" placeholder="Ingresa tu contraseña">
              <button type="button" class="pw-toggle" aria-label="Mostrar contraseña" data-password-toggle="loginPassword"><i class="ph ph-eye" aria-hidden="true"></i></button>
            </div>
          </div>

          <div class="auth-options">
            <label class="check-row"><input type="checkbox" class="checkbox" id="rememberEmail"><span>Recordar mi correo</span></label>
            <a href="#" id="forgotPassword">¿Olvidaste tu contraseña?</a>
          </div>

          <button type="submit" class="btn btn--primary btn--lg btn--block">Ingresar <i class="ph ph-arrow-right" aria-hidden="true"></i></button>
        </form>

        <p class="auth-footer">¿Aún no tienes una cuenta? <a href="registro.html">Regístrate aquí</a></p>
      </section>
    </div>
  </main>
</body>
</html>
